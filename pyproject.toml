[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "busca-emprego-facil"
version = "2.0.0"
description = "Ferramenta moderna para consolidação e busca de vagas de emprego — scrapers nacionais e regionais de Pernambuco"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rafael Batista", email = "recifecrypto@gmail.com" },
]
keywords = [
    "emprego", "vagas", "scraping", "recife", "pernambuco",
    "gupy", "linkedin", "indeed", "infojobs", "trabalhabrasil"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business :: News/Diary",
]

[project.urls]
Homepage = "https://github.com/RafaelBatistaDev/Busca-Emprego-Facil"
Repository = "https://github.com/RafaelBatistaDev/Busca-Emprego-Facil.git"
Issues = "https://github.com/RafaelBatistaDev/Busca-Emprego-Facil/issues"
